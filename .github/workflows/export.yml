name: Export binaires
on:
  push:
    branches: [export-binaires]
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43342896729
          name: etape-1-musique
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out/fw
      - uses: actions/download-artifact@v4
        with:
          run-id: 43342896729
          name: app-android
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out/apk
      - run: |
          mkdir -p binaires
          mv out/fw/firmware.bin binaires/v1-musique-d1-mini.bin
          mv out/apk/app-debug.apk binaires/IntercomMoto.apk
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f binaires
          git commit -m "Binaires du build 43342896729" || true
          git push
