name: Export binaires
on:
  push:
    branches: [export-binaires]
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43402653246
          name: etape-1-musique
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out/fw
      - run: |
          mkdir -p binaires
          mv out/fw/firmware.bin binaires/v2-musique-appels.bin
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f binaires
          git commit -m "Binaires du build 43402653246" || true
          git push
