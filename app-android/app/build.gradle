plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.meudo.intercom'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.meudo.intercom'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.3.1'
    }

    // Clé de signature fixe, enregistrée dans le dépôt : chaque APK compilé par GitHub
    // est signé pareil, donc Android accepte la mise à jour sans désinstaller l'app.
    // (Clé de test sans valeur secrète, à ne pas utiliser pour publier sur le Play Store.)
    signingConfigs {
        debug {
            storeFile file('intercom-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
