; Intercom moto - étape 1 : lecteur de musique Bluetooth (ESP32 classique, A2DP)
[env:esp32]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; Bluetooth classique : le programme dépasse la partition par défaut
board_build.partitions = huge_app.csv
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
