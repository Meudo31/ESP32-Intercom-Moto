; Intercom moto - étape 1 : musique et appels Bluetooth (ESP32 classique, A2DP + HFP)
;
; Depuis le firmware 2.0.0, le noyau Arduino est compilé comme composant d'ESP-IDF
; (framework = arduino, espidf) : le noyau Arduino précompilé envoie la voix des appels
; sur des broches PCM au lieu de la donner au programme. La configuration est dans
; sdkconfig.defaults. La première compilation est plus longue (5 à 10 minutes).
[env:esp32]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino, espidf
monitor_speed = 115200
; Deux emplacements de 1,9 Mo : nécessaires pour la mise à jour par l'app (OTA)
board_build.partitions = min_spiffs.csv
; Transforme data/sonnerie.wav en include/sonnerie_wav.h avant chaque compilation
extra_scripts = pre:outils/sonnerie_wav.py
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
