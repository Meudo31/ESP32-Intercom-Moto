; Intercom moto - étape 3 : musique Bluetooth + intercom ESP-NOW dans le même boîtier
[env:esp32]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; Bluetooth classique + Wi-Fi : le programme dépasse la partition par défaut
board_build.partitions = huge_app.csv
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
